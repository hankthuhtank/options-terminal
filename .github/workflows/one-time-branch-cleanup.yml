name: One-time branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete every non-main branch
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "fix/vellum-logo"
            "fix/vellum-logo-final"
            "fix/vellum-logo-pr"
            "fix/vellum-logo-publish"
            "fix/vellum-logo-ready"
            "fix/vellum-logo-review"
            "maintenance/repo-organization"
            "maintenance/repo-organization-final"
            "maintenance/repo-organization-stage"
            "redesign/brand-evolution"
            "redesign/product-studio-overhaul"
          )
          for branch in "${branches[@]}"; do
            git push origin --delete "$branch" || true
          done

      - name: Remove this one-time workflow and leave completion marker
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-branch-cleanup.yml
          printf 'branch cleanup completed\n' > .branch-cleanup-complete
          git add -A
          git commit -m "Complete one-time branch cleanup"
          git push origin HEAD:main
