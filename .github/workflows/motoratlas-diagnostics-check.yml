name: MotorAtlas diagnostics check
on:
  push:
    paths:
      - '.github/workflows/motoratlas-diagnostics-check.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check JavaScript
        run: |
          node --check motoratlas/atlas.js
          node --check motoratlas/atlas-core.js
          node --check motoratlas/diagnostics-data.js
          node --check motoratlas/diagnostics-v2.js
      - name: Write success marker and clean checker
        run: |
          echo 'MotorAtlas expanded diagnostics checks passed.' > motoratlas/.diagnostics-ok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/motoratlas-diagnostics-check.yml
          git add motoratlas/.diagnostics-ok
          git commit -m "Verify expanded MotorAtlas diagnostics"
          git push origin main
