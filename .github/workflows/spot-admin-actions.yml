name: Polish SPOT admin actions

on:
  push:
    paths:
      - '.github/workflows/spot-admin-actions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin auction actions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('spot/payments.js')
          s = p.read_text()

          old = "function enhanceAdminRows(){document.querySelectorAll('#adminAuctions .admin-row').forEach(row=>{const edit=row.querySelector('[data-edit]');if(!edit||row.querySelector('.charge-auction'))return;const b=document.createElement('button');b.className='secondary charge-auction';b.textContent='END + CHARGE';b.style.marginLeft='6px';b.onclick=e=>{e.stopPropagation();closeAuction(edit.dataset.edit,b)};edit.insertAdjacentElement('afterend',b)})}"
          new = "async function deleteAuction(id,button){const title=button.closest('.admin-row')?.querySelector('b')?.textContent||'this auction';if(!confirm(`Delete ${title}? This permanently removes the auction and its placement boxes. Auctions with bids or payment history cannot be deleted.`))return;button.disabled=true;button.textContent='DELETING…';const {data,error}=await paySb.rpc('delete_spot_auction',{p_auction_id:id});if(error){button.disabled=false;button.textContent='DELETE';return note(error.message)}if(!data){button.disabled=false;button.textContent='DELETE';return note('Auction was not found')}note('Auction deleted');setTimeout(()=>location.reload(),650)}\nfunction enhanceAdminRows(){document.querySelectorAll('#adminAuctions .admin-row').forEach(row=>{const edit=row.querySelector('[data-edit]');if(!edit||row.querySelector('.admin-actions'))return;const id=edit.dataset.edit;const actions=document.createElement('div');actions.className='admin-actions';edit.parentNode.insertBefore(actions,edit);edit.classList.add('admin-action','admin-edit');actions.appendChild(edit);const charge=document.createElement('button');charge.className='admin-action charge-auction';charge.textContent='END + CHARGE';charge.onclick=e=>{e.stopPropagation();closeAuction(id,charge)};actions.appendChild(charge);const del=document.createElement('button');del.className='admin-action delete-auction';del.textContent='DELETE';del.onclick=e=>{e.stopPropagation();deleteAuction(id,del)};actions.appendChild(del)})}"
          if old not in s:
              raise SystemExit('Expected enhanceAdminRows block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          css = Path('spot/v3.css')
          c = css.read_text()
          addon = "\n.admin-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;white-space:nowrap}.admin-action{height:38px;border-radius:10px;padding:0 13px;font:800 10px var(--mono);letter-spacing:.035em;transition:.18s;border:1px solid #333;background:#171717;color:#eee}.admin-action:hover{transform:translateY(-1px);border-color:#4a4a4a;background:#1d1d1d}.charge-auction{border-color:rgba(200,255,46,.45);background:rgba(200,255,46,.09);color:var(--acid)}.charge-auction:hover{border-color:var(--acid);background:rgba(200,255,46,.15)}.delete-auction{border-color:#462222;background:#1b1010;color:#d98282}.delete-auction:hover{border-color:#8a3535;background:#2a1212;color:#ff9b9b}.admin-action:disabled{opacity:.5;cursor:not-allowed;transform:none}@media(max-width:700px){.admin-row{grid-template-columns:24px 1fr}.admin-actions{grid-column:1/-1;justify-content:flex-end;flex-wrap:wrap}.admin-action{height:36px}}\n"
          if '.admin-actions{' not in c:
              c += addon
          css.write_text(c)

          html = Path('spot/index.html')
          h = html.read_text()
          h = h.replace('v3.css?v=2', 'v3.css?v=3')
          h = h.replace('payments.js?v=2', 'payments.js?v=3')
          html.write_text(h)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spot/payments.js spot/v3.css spot/index.html
          git commit -m "Add safe auction delete and polish admin actions"
          git push
