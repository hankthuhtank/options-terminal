name: Validate no-repeat reading passes
on:
  push:
    paths:
      - 'motoratlas/no-repeat.js'
      - 'motoratlas/atlas.js'
      - 'thetradeschool/js/core/v17-no-repeat.js'
      - 'thetradeschool/index.html'
      - '.github/workflows/no-repeat-check.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check motoratlas/no-repeat.js
          node --check thetradeschool/js/core/v17-no-repeat.js
      - name: Check published wiring
        run: |
          grep -q 'no-repeat.js' motoratlas/atlas.js
          grep -q 'v17-no-repeat.js' thetradeschool/index.html
      - name: Mark successful validation
        run: |
          printf 'No-repeat reading passes validated.\n' > .no-repeat-ok
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .no-repeat-ok
          git commit -m 'Verify no-repeat reading passes'
          git push
