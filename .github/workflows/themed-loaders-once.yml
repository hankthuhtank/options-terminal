name: Apply themed loading screens

on:
  push:
    paths:
      - '.github/workflows/themed-loaders-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch project entry pages
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          SCRIPT = r'''
          <script id="ss-loader-script">
          (()=>{
            const el=document.getElementById('ss-themed-loader');
            if(!el) return;
            const started=performance.now();
            let leaving=false;
            const leave=()=>{
              if(leaving) return;
              leaving=true;
              const wait=Math.max(0,1100-(performance.now()-started));
              setTimeout(()=>{
                el.classList.add('is-leaving');
                setTimeout(()=>el.remove(),520);
              },wait);
            };
            if(document.readyState==='complete') leave();
            else window.addEventListener('load',leave,{once:true});
            setTimeout(leave,2200);
          })();
          </script>
          '''

          def patch(path, css, markup):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if 'id="ss-themed-loader"' in text:
                  print(f'{path}: loader already present')
                  return
              if '</head>' not in text.lower():
                  raise RuntimeError(f'{path}: missing </head>')
              text=re.sub(r'</head>', css+'\n</head>', text, count=1, flags=re.I)
              text,n=re.subn(r'(<body\b[^>]*>)', lambda m:m.group(1)+'\n'+markup, text, count=1, flags=re.I)
              if n!=1:
                  raise RuntimeError(f'{path}: missing <body>')
              text,n=re.subn(r'</body>', SCRIPT+'\n</body>', text, count=1, flags=re.I)
              if n!=1:
                  raise RuntimeError(f'{path}: missing </body>')
              p.write_text(text,encoding='utf-8')
              print(f'{path}: patched')

          vellum_css=r'''
          <style id="ss-loader-style">
          #ss-themed-loader{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#e4dac4;color:#2b241b;overflow:hidden;transition:opacity .48s ease,visibility .48s ease}
          #ss-themed-loader.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
          #ss-themed-loader::before{content:"";position:absolute;inset:0;opacity:.52;background:radial-gradient(circle at 18% 16%,rgba(168,131,44,.12),transparent 32%),radial-gradient(circle at 82% 78%,rgba(76,107,79,.09),transparent 34%),repeating-linear-gradient(0deg,transparent 0 31px,rgba(43,36,27,.055) 31px 32px)}
          .ss-vellum-loader{position:relative;width:min(430px,82vw);text-align:center;font-family:"Cardo",Georgia,serif}
          .ss-vellum-kicker{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#746754;margin-bottom:22px}
          .ss-vellum-book{width:112px;height:74px;margin:0 auto 24px;position:relative;perspective:600px}
          .ss-vellum-book::before,.ss-vellum-book::after{content:"";position:absolute;top:0;width:52px;height:68px;background:#ede5d3;border:1px solid rgba(43,36,27,.34);box-shadow:inset 0 0 0 5px rgba(168,131,44,.04)}
          .ss-vellum-book::before{right:50%;transform-origin:right center;transform:rotateY(-12deg);border-radius:3px 0 0 3px}
          .ss-vellum-book::after{left:50%;transform-origin:left center;transform:rotateY(12deg);border-radius:0 3px 3px 0}
          .ss-vellum-book i{position:absolute;z-index:3;left:50%;top:3px;bottom:3px;width:1px;background:#a8832c;box-shadow:0 0 10px rgba(168,131,44,.25)}
          .ss-vellum-book span{position:absolute;z-index:4;left:18px;right:18px;height:1px;background:rgba(43,36,27,.18);animation:ss-vellum-write 1.2s ease-in-out infinite alternate}
          .ss-vellum-book span:nth-child(1){top:23px}.ss-vellum-book span:nth-child(2){top:35px;animation-delay:.16s}.ss-vellum-book span:nth-child(3){top:47px;animation-delay:.32s}
          .ss-vellum-name{font-family:"Cinzel",Georgia,serif;font-size:clamp(28px,7vw,42px);font-weight:700;letter-spacing:.34em;text-indent:.34em}
          .ss-vellum-sub{margin-top:9px;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.19em;text-transform:uppercase;color:#746754}
          .ss-vellum-rule{height:1px;width:180px;margin:22px auto 12px;background:linear-gradient(90deg,transparent,#b32b17 30%,#a8832c 70%,transparent);position:relative;overflow:hidden}
          .ss-vellum-rule::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:translateX(-100%);animation:ss-vellum-sweep 1s ease-in-out infinite}
          @keyframes ss-vellum-write{from{transform:scaleX(.42);opacity:.45}to{transform:scaleX(1);opacity:.9}}
          @keyframes ss-vellum-sweep{to{transform:translateX(100%)}}
          @media(prefers-reduced-motion:reduce){.ss-vellum-book span,.ss-vellum-rule::after{animation:none}}
          </style>
          '''
          vellum_markup=r'''
          <div id="ss-themed-loader" aria-hidden="true">
            <div class="ss-vellum-loader">
              <div class="ss-vellum-kicker">Interactive reading desk</div>
              <div class="ss-vellum-book"><span></span><span></span><span></span><i></i></div>
              <div class="ss-vellum-name">VELLUM</div>
              <div class="ss-vellum-sub">Opening the folio</div>
              <div class="ss-vellum-rule"></div>
            </div>
          </div>
          '''

          trade_css=r'''
          <style id="ss-loader-style">
          #ss-themed-loader{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#07100d;color:#f2f7f1;overflow:hidden;transition:opacity .45s ease,visibility .45s ease}
          #ss-themed-loader.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
          #ss-themed-loader::before{content:"";position:absolute;inset:-20%;background-image:linear-gradient(rgba(215,255,100,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(215,255,100,.045) 1px,transparent 1px);background-size:38px 38px;transform:perspective(500px) rotateX(58deg) translateY(22%);transform-origin:center bottom;opacity:.75}
          .ss-trade-loader{position:relative;width:min(470px,86vw);font-family:"Saira",system-ui,sans-serif}
          .ss-trade-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(223,255,230,.13);padding-bottom:12px;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#91a198}
          .ss-trade-top b{color:#d7ff64;font-weight:500}
          .ss-trade-name{font-family:"Saira Condensed",sans-serif;font-size:clamp(50px,13vw,82px);font-weight:700;line-height:.78;letter-spacing:-.045em;text-transform:uppercase;margin:30px 0 28px}.ss-trade-name span{color:#d7ff64}
          .ss-trade-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
          .ss-trade-node{height:46px;border:1px solid rgba(223,255,230,.14);background:#0f1c17;display:grid;place-items:center;position:relative;overflow:hidden}
          .ss-trade-node::after{content:"";width:7px;height:7px;border-radius:50%;background:#31453a;box-shadow:0 0 0 transparent;animation:ss-trade-live 1.2s infinite}
          .ss-trade-node:nth-child(2)::after{animation-delay:.14s}.ss-trade-node:nth-child(3)::after{animation-delay:.28s}.ss-trade-node:nth-child(4)::after{animation-delay:.42s}.ss-trade-node:nth-child(5)::after{animation-delay:.56s}.ss-trade-node:nth-child(6)::after{animation-delay:.7s}
          .ss-trade-labels{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:7px;font-family:"IBM Plex Mono",monospace;font-size:7px;letter-spacing:.08em;color:#708279;text-align:center;text-transform:uppercase}
          .ss-trade-status{margin-top:24px;display:flex;align-items:center;gap:12px;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#91a198}.ss-trade-status i{display:block;height:1px;flex:1;background:rgba(223,255,230,.12);overflow:hidden;position:relative}.ss-trade-status i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#d7ff64,transparent);animation:ss-trade-scan 1s linear infinite}
          @keyframes ss-trade-live{0%,100%{background:#31453a;box-shadow:none}45%{background:#d7ff64;box-shadow:0 0 16px rgba(215,255,100,.65)}}
          @keyframes ss-trade-scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
          @media(prefers-reduced-motion:reduce){.ss-trade-node::after,.ss-trade-status i::after{animation:none}}
          </style>
          '''
          trade_markup=r'''
          <div id="ss-themed-loader" aria-hidden="true">
            <div class="ss-trade-loader">
              <div class="ss-trade-top"><span>FIELD SYSTEM / STARTUP</span><b>SHOP ONLINE</b></div>
              <div class="ss-trade-name">TRADE<span>SCHOOL</span></div>
              <div class="ss-trade-grid"><div class="ss-trade-node"></div><div class="ss-trade-node"></div><div class="ss-trade-node"></div><div class="ss-trade-node"></div><div class="ss-trade-node"></div><div class="ss-trade-node"></div></div>
              <div class="ss-trade-labels"><span>Power</span><span>Air</span><span>Water</span><span>Metal</span><span>Machine</span><span>Build</span></div>
              <div class="ss-trade-status"><span>Bringing the shop online</span><i></i></div>
            </div>
          </div>
          '''

          overtone_css=r'''
          <style id="ss-loader-style">
          #ss-themed-loader{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#0b0908;color:#f3ecdd;overflow:hidden;transition:opacity .5s ease,visibility .5s ease}
          #ss-themed-loader.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
          #ss-themed-loader::before{content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,rgba(217,164,65,.08),transparent 63%);filter:blur(20px)}
          .ss-overtone-loader{position:relative;width:min(520px,86vw);text-align:center}
          .ss-overtone-kicker{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#736555;margin-bottom:24px}
          .ss-overtone-name{font-family:"Fraunces",Georgia,serif;font-size:clamp(44px,12vw,76px);font-weight:900;letter-spacing:.14em;text-indent:.14em;line-height:1;color:#f3ecdd}
          .ss-overtone-name em{font-weight:400;color:#d9a441;font-size:.31em;letter-spacing:.23em;display:block;margin-top:10px}
          .ss-overtone-string{height:74px;position:relative;margin:26px auto 16px;width:min(440px,80vw)}
          .ss-overtone-string::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,#9c7629 8%,#d9a441 50%,#9c7629 92%,transparent)}
          .ss-overtone-string i{position:absolute;left:8%;right:8%;top:50%;height:28px;border-top:2px solid #d9a441;border-radius:50%;transform:translateY(-14px) scaleY(.22);filter:drop-shadow(0 0 7px rgba(217,164,65,.3));animation:ss-overtone-vibe .22s ease-in-out infinite alternate}
          .ss-overtone-string span{position:absolute;top:50%;width:7px;height:7px;border-radius:50%;background:#5fb8a6;box-shadow:0 0 14px rgba(95,184,166,.5);transform:translate(-50%,-50%)}
          .ss-overtone-string span:nth-of-type(1){left:18%}.ss-overtone-string span:nth-of-type(2){left:34%}.ss-overtone-string span:nth-of-type(3){left:50%}.ss-overtone-string span:nth-of-type(4){left:66%}.ss-overtone-string span:nth-of-type(5){left:82%}
          .ss-overtone-status{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#ab9e8c}
          @keyframes ss-overtone-vibe{from{transform:translateY(-14px) scaleY(.18)}to{transform:translateY(-14px) scaleY(1)}}
          @media(prefers-reduced-motion:reduce){.ss-overtone-string i{animation:none;transform:translateY(-14px) scaleY(.55)}}
          </style>
          '''
          overtone_markup=r'''
          <div id="ss-themed-loader" aria-hidden="true">
            <div class="ss-overtone-loader">
              <div class="ss-overtone-kicker">Playable music theory workbench</div>
              <div class="ss-overtone-name">OVERTONE<em>HEAR HOW MUSIC WORKS</em></div>
              <div class="ss-overtone-string"><i></i><span></span><span></span><span></span><span></span><span></span></div>
              <div class="ss-overtone-status">Tuning the workbench…</div>
            </div>
          </div>
          '''

          motor_css=r'''
          <style id="ss-loader-style">
          #ss-themed-loader{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#090b0c;color:#f1efe8;overflow:hidden;transition:opacity .46s ease,visibility .46s ease}
          #ss-themed-loader.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
          #ss-themed-loader::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:52px 52px;mask-image:radial-gradient(circle at center,#000 0,transparent 76%)}
          .ss-motor-loader{position:relative;width:min(510px,86vw);font-family:"IBM Plex Mono",monospace}
          .ss-motor-head{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.11);padding-bottom:11px;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#647076}.ss-motor-head b{font-weight:500;color:#f0a43b}
          .ss-motor-name{font-family:"Saira Condensed",sans-serif;font-size:clamp(54px,14vw,88px);font-weight:800;line-height:.8;letter-spacing:-.035em;text-transform:uppercase;margin:30px 0 24px}.ss-motor-name span{color:#f0a43b}
          .ss-engine-bank{height:86px;border:1px solid rgba(255,255,255,.11);background:#0e1112;display:flex;align-items:end;justify-content:center;gap:9px;padding:13px 22px;position:relative;overflow:hidden}
          .ss-engine-bank::before{content:"ENGINE / SYSTEM INDEX";position:absolute;left:10px;top:8px;font-size:7px;letter-spacing:.12em;color:#4f5a5f}.ss-engine-bank::after{content:"";position:absolute;left:0;right:0;height:1px;top:0;background:linear-gradient(90deg,transparent,#75c7d1,transparent);box-shadow:0 0 16px rgba(117,199,209,.4);animation:ss-motor-scan 1.25s linear infinite}
          .ss-piston{width:48px;height:48px;border:1px solid rgba(255,255,255,.13);position:relative}.ss-piston i{position:absolute;left:8px;right:8px;top:7px;height:15px;background:#f0a43b;animation:ss-motor-piston .7s ease-in-out infinite alternate}.ss-piston:nth-child(2) i{animation-delay:-.35s}.ss-piston:nth-child(4) i{animation-delay:-.35s}
          .ss-motor-status{margin-top:17px;display:flex;justify-content:space-between;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#647076}.ss-motor-status strong{color:#75c7d1;font-weight:500}
          @keyframes ss-motor-piston{from{transform:translateY(0)}to{transform:translateY(20px)}}
          @keyframes ss-motor-scan{from{transform:translateY(0)}to{transform:translateY(84px)}}
          @media(prefers-reduced-motion:reduce){.ss-piston i,.ss-engine-bank::after{animation:none}}
          </style>
          '''
          motor_markup=r'''
          <div id="ss-themed-loader" aria-hidden="true">
            <div class="ss-motor-loader">
              <div class="ss-motor-head"><span>Reference plate / startup</span><b>Machine online</b></div>
              <div class="ss-motor-name">MOTOR<span>ATLAS</span></div>
              <div class="ss-engine-bank"><div class="ss-piston"><i></i></div><div class="ss-piston"><i></i></div><div class="ss-piston"><i></i></div><div class="ss-piston"><i></i></div></div>
              <div class="ss-motor-status"><span>Indexing the machine…</span><strong>Parts · systems · diagnosis</strong></div>
            </div>
          </div>
          '''

          patch('vellum/index.html',vellum_css,vellum_markup)
          patch('thetradeschool/index.html',trade_css,trade_markup)
          patch('overtone/index.html',overtone_css,overtone_markup)
          patch('motoratlas/index.html',motor_css,motor_markup)
          PY

      - name: Commit themed loaders
        shell: bash
        run: |
          git config user.name "Safi Solutions"
          git config user.email "actions@users.noreply.github.com"
          git add vellum/index.html thetradeschool/index.html overtone/index.html motoratlas/index.html
          if git diff --cached --quiet; then
            echo "No loader changes needed."
            exit 0
          fi
          git commit -m "Add themed loading screens to project sites"
          git push
