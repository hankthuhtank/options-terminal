name: Validate CarDesk and MoveDesk

on:
  push:
    paths:
      - '.github/workflows/validate-tools-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check cardesk/app.js
          node --check movedesk/app.js
      - name: Required DOM contracts
        run: |
          grep -q 'id="vinForm"' cardesk/index.html
          grep -q 'id="workspace"' cardesk/index.html
          grep -q 'id="routeForm"' movedesk/index.html
          grep -q 'id="map"' movedesk/index.html
      - name: Public API smoke test
        run: |
          node <<'NODE'
          const checks = [
            ['vPIC','https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValuesExtended/1HGCM82633A004352?format=json', j => j.Results?.[0]?.Make],
            ['NHTSA recalls','https://api.nhtsa.gov/recalls/recallsByVehicle?make=HONDA&model=ACCORD&modelYear=2003', j => Array.isArray(j.results || j.Results)],
            ['Open-Meteo geocoding','https://geocoding-api.open-meteo.com/v1/search?name=Paris%2C%20Texas&count=1&language=en&format=json', j => j.results?.[0]?.latitude],
            ['Open-Meteo forecast','https://api.open-meteo.com/v1/forecast?latitude=33.66&longitude=-95.55&current=temperature_2m&temperature_unit=fahrenheit', j => j.current?.temperature_2m]
          ];
          for (const [name,url,test] of checks) {
            const r = await fetch(url);
            if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
            const j = await r.json();
            if (!test(j)) throw new Error(`${name}: unexpected response`);
            console.log(`${name}: ok`);
          }
          NODE
