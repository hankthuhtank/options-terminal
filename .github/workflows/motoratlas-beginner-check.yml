name: Validate MotorAtlas beginner redesign
on:
  push:
    paths:
      - '.github/workflows/motoratlas-beginner-check.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check motoratlas/atlas.js
          node --check motoratlas/atlas-core.js
          node --check motoratlas/beginner-data.js
          node --check motoratlas/beginner-ui.js
          node --check motoratlas/diagnostics-data.js
          node --check motoratlas/diagnostics-v2.js
      - name: Bump browser loader version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('motoratlas/index.html')
          s=p.read_text()
          s=s.replace('atlas.js?v=3','atlas.js?v=4')
          p.write_text(s)
          PY
          grep -q 'atlas.js?v=4' motoratlas/index.html
      - name: Commit version bump
        run: |
          git config user.name 'MotorAtlas Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add motoratlas/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish MotorAtlas beginner-first experience'
            git push
          fi