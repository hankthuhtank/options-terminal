name: TAKEOVER V1 safety fixes
on:
  push:
    paths:
      - '.github/workflows/takeover-v1-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch TAKEOVER client
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('spot/takeover.js')
          s=p.read_text()
          s=s.replace("let mode='takeover',selected=[],bidLevels={},seedSpot=null,selectedLogoUrl=null,toastTimer=null,channel=null,noticeChannel=null;","let mode='takeover',selected=[],bidLevels={},seedSpot=null,selectedLogoUrl=null,toastTimer=null,channel=null,noticeChannel=null,boardPoll=null;")
          old="""function subscribe(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel('takeover-board-v1').on('postgres_changes',{event:'*',schema:'public',table:'takeover_spots'},()=>refreshBoard()).subscribe();
  if(session){if(noticeChannel)sb.removeChannel(noticeChannel);noticeChannel=sb.channel('takeover-alerts-'+session.user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'takeover_notifications',filter:`user_id=eq.${session.user.id}`},p=>{toast(p.new?.title||'TAKEOVER alert');updateAlertBadge()}).subscribe()}
}"""
          new="""function subscribe(){
  if(boardPoll)clearInterval(boardPoll);boardPoll=setInterval(refreshBoard,2000);
  if(noticeChannel)sb.removeChannel(noticeChannel);noticeChannel=null;
  if(session){noticeChannel=sb.channel('takeover-alerts-'+session.user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'takeover_notifications',filter:`user_id=eq.${session.user.id}`},p=>{toast(p.new?.title||'TAKEOVER alert');updateAlertBadge()}).subscribe()}
}"""
          if old not in s: raise SystemExit('subscribe block not found')
          s=s.replace(old,new,1)
          s=s.replace("function saveDraft(){try{localStorage.setItem('takeover_purchase_draft',JSON.stringify(draftData()))}catch{}}","function saveDraft(){if(!selected.length)return;try{localStorage.setItem('takeover_purchase_draft',JSON.stringify(draftData()))}catch{}}",1)
          old="""async function uploadLogo(){const f=$('#logoFile').files?.[0];if(!f)return selectedLogoUrl||profile?.logo_url||null;if(!session)throw new Error('Sign in first');if(f.size>2097152)throw new Error('Logo must be under 2 MB');if(!['image/png','image/jpeg','image/webp'].includes(f.type))throw new Error('Use PNG, JPG or WebP');const ext=f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg',path=`${session.user.id}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('takeover-logos').upload(path,f,{contentType:f.type,upsert:false});if(error)throw error;return sb.storage.from('takeover-logos').getPublicUrl(path).data.publicUrl}"""
          new="""async function uploadSpecificLogo(f){if(!f)return null;if(!session)throw new Error('Sign in first');if(f.size>2097152)throw new Error('Logo must be under 2 MB');if(!['image/png','image/jpeg','image/webp'].includes(f.type))throw new Error('Use PNG, JPG or WebP');const ext=f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg',path=`${session.user.id}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('takeover-logos').upload(path,f,{contentType:f.type,upsert:false});if(error)throw error;return sb.storage.from('takeover-logos').getPublicUrl(path).data.publicUrl}
async function uploadLogo(){const f=$('#logoFile').files?.[0];if(!f)return selectedLogoUrl||profile?.logo_url||null;return uploadSpecificLogo(f)}"""
          if old not in s: raise SystemExit('upload block not found')
          s=s.replace(old,new,1)
          old="""$('#saveBrand').onclick=async()=>{if(!session||!profile)return toast('Take your first spot to create a brand profile');const company=$('#accountCompany').value.trim(),website=normalizeWebsite($('#accountWebsite').value);try{let logo=profile.logo_url;const f=$('#accountLogo').files?.[0];if(f){$('#logoFile').files=$('#accountLogo').files;logo=await uploadLogo();$('#logoFile').value=''}const {error}=await sb.rpc('update_takeover_brand',{p_company_name:company,p_website:website,p_logo_url:logo});if(error)throw error;toast('Brand updated');await loadIdentity();await refreshBoard();renderAccount()}catch(e){toast(e.message)}};"""
          new="""$('#saveBrand').onclick=async()=>{if(!session||!profile)return toast('Take your first spot to create a brand profile');const company=$('#accountCompany').value.trim(),website=normalizeWebsite($('#accountWebsite').value);try{let logo=profile.logo_url;const f=$('#accountLogo').files?.[0];if(f)logo=await uploadSpecificLogo(f);const {error}=await sb.rpc('update_takeover_brand',{p_company_name:company,p_website:website,p_logo_url:logo});if(error)throw error;toast('Brand updated');await loadIdentity();await refreshBoard();renderAccount()}catch(e){toast(e.message)}};"""
          if old not in s: raise SystemExit('saveBrand block not found')
          s=s.replace(old,new,1)
          s=s.replace("if(profile){$('#companyName').value=profile.company_name||'';$('#companyWebsite').value=profile.website||''}","if(profile){$('#companyName').value=profile.company_name||'';$('#companyWebsite').value=profile.website||''}else{$('#companyName').value='';$('#companyWebsite').value=''}",1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spot/takeover.js
          git commit -m "Harden TAKEOVER client" || exit 0
          git push
