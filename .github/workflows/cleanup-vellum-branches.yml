name: Clean up temporary Vellum branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete temporary branches
        shell: bash
        run: |
          git push origin --delete \
            fix/vellum-logo \
            fix/vellum-logo-final \
            fix/vellum-logo-pr \
            fix/vellum-logo-publish \
            fix/vellum-logo-ready \
            fix/vellum-logo-review || true
      - name: Remove cleanup workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/cleanup-vellum-branches.yml
          git commit -m "Remove temporary branch cleanup workflow"
          git push origin HEAD:main
