name: Apply Vellum logo swap

on:
  push:
    branches:
      - fix/vellum-logo

permissions:
  contents: write

jobs:
  swap-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/vellum-logo

      - name: Replace VELLVM wordmarks with project logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('vellum/index.html')
          text = path.read_text(encoding='utf-8')

          old_wordmark = '<span class="wordmark">VELL<b>V</b>M</span>'
          mobile_logo = '<span class="wordmark" aria-label="Vellum"><img src="../assets/project-logos/vellum.svg" alt="" style="display:block;width:auto;height:34px;max-width:125px;margin:0 auto"></span>'
          spine_logo = '<span class="wordmark" aria-label="Vellum"><img src="../assets/project-logos/vellum.svg" alt="" style="display:block;width:100%;max-width:190px;height:auto;margin:0"></span>'

          if text.count(old_wordmark) != 2:
              raise SystemExit(f'Expected 2 VELLVM wordmarks, found {text.count(old_wordmark)}')
          text = text.replace(old_wordmark, mobile_logo, 1)
          text = text.replace(old_wordmark, spine_logo, 1)

          old_title = '<h1 class="front-title">VELL<b>V</b>M</h1>'
          new_title = '<h1 class="front-title" aria-label="Vellum"><img src="../assets/project-logos/vellum.svg" alt="" style="display:block;width:min(78vw,460px);height:auto;margin:0 auto"></h1>'
          if text.count(old_title) != 1:
              raise SystemExit(f'Expected 1 VELLVM front title, found {text.count(old_title)}')
          text = text.replace(old_title, new_title)

          path.write_text(text, encoding='utf-8')
          PY

          if grep -Fq 'VELL<b>V</b>M' vellum/index.html; then
            echo 'VELLVM wordmark still present' >&2
            exit 1
          fi

          git diff --check -- vellum/index.html

      - name: Commit only the requested change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- vellum/index.html
          git rm -- .github/workflows/vellum-logo-swap.yml
          git commit -m "Replace Vellum wordmarks with project logo"
          git push origin HEAD:fix/vellum-logo
