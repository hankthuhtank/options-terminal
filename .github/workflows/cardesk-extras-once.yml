name: Wire CarDesk extras
on:
  push:
    paths:
      - '.github/workflows/cardesk-extras-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add extras script
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('cardesk/index.html')
          s=p.read_text(encoding='utf-8')
          if 'extras.js?v=1' not in s:
              s=s.replace('<script src="app.js?v=2"></script>','<script src="app.js?v=2"></script>\n<script src="extras.js?v=1"></script>')
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "Safi Solutions"
          git config user.email "actions@users.noreply.github.com"
          git add cardesk/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Enable CarDesk interactive diagram polish"
            git push
          fi
