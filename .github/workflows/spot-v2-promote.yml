name: Promote SPOT V2
on:
  workflow_dispatch:
  push:
    paths:
      - 'spot/v2.html'
      - 'spot/v2.js'
jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Promote V2 to live index
        run: cp spot/v2.html spot/index.html
      - name: Commit live V2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spot/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Promote SPOT V2 to live app"
          git push
