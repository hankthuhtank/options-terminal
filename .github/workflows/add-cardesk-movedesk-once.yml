name: Add CarDesk and MoveDesk to portfolio

on:
  push:
    paths:
      - '.github/workflows/add-cardesk-movedesk-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update portfolio project list
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('Seven projects built around the same idea: take something complicated or overlooked and make it easier to understand, use, or explore.', 'Nine projects built around the same idea: take something complicated or overlooked and make it easier to understand, use, or explore.')

          start=text.index('<div class="project-list reveal">')
          end=text.index('</div>\n  </div>\n</section>', start)
          block=text[start:end]

          if 'href="/cardesk/"' not in block:
              insert='''<div class="project-list reveal">\n      <a class="project-row" href="/cardesk/" target="_blank" rel="noopener">\n        <span class="project-num">01</span>\n        <span class="project-name"><span class="kind">Vehicle utility · Live data</span><img class="project-logo" src="/assets/project-logos/cardesk.svg" alt="CarDesk"></span>\n        <span class="project-desc">A VIN-powered vehicle workspace that decodes the car, checks NHTSA recalls and complaint signals, runs ownership math, decodes common OBD-II codes and keeps a private service log.</span>\n        <span class="project-open">Open tool ↗</span>\n      </a>\n      <a class="project-row" href="/movedesk/" target="_blank" rel="noopener">\n        <span class="project-num">02</span>\n        <span class="project-name"><span class="kind">Relocation utility · Live data</span><img class="project-logo" src="/assets/project-logos/movedesk.svg" alt="MoveDesk"></span>\n        <span class="project-desc">A relocation command table that compares two places with live weather, route mapping, recent climate patterns, move-cost math and a personalized action plan.</span>\n        <span class="project-open">Open tool ↗</span>\n      </a>'''
              block=block.replace('<div class="project-list reveal">', insert, 1)

          # Renumber only the seven original rows after the two new tools.
          original_numbers=['01','02','03','04','05','06','07']
          replacement=['03','04','05','06','07','08','09']
          # Find original rows by their hrefs so new numbers are untouched.
          hrefs=['/vellum/','https://thetradingdesk.org','/thetradeschool/','/thebench/','/voltvisual/','/overtone/','/motoratlas/']
          for href,num in zip(hrefs,replacement):
              pattern=r'(<a class="project-row" href="'+re.escape(href)+r'"[\s\S]*?<span class="project-num">)\d\d(</span>)'
              block,n=re.subn(pattern, lambda m:m.group(1)+num+m.group(2), block, count=1)
              if n!=1:
                  raise RuntimeError(f'Could not renumber {href}')

          text=text[:start]+block+text[end:]
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit portfolio update
        shell: bash
        run: |
          git config user.name "Safi Solutions"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No portfolio changes needed."
            exit 0
          fi
          git commit -m "Feature CarDesk and MoveDesk on Safi Solutions"
          git push
