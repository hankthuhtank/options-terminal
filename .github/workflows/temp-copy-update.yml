name: Temporary Safi copy update

on:
  push:
    paths:
      - '.github/workflows/temp-copy-update.yml'

permissions:
  contents: write

jobs:
  update-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Tighten homepage copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Hero headline
          text, n = re.subn(
              r'''    <h1>\n      <span class="line"><span>Products\. Websites\.</span></span>\n      <span class="line"><span>Business tools\.</span></span>\n      <span class="line rot"><span class="grad" id="rotword">.*?</span><span class="rot-ghost" aria-hidden="true">.*?</span></span>\n    </h1>''',
              '''    <h1>\n      <span class="line"><span>Products. Websites.</span></span>\n      <span class="line"><span>Business tools.</span></span>\n      <span class="line rot"><span class="grad" id="rotword">Built to be useful.</span><span class="rot-ghost" aria-hidden="true">Made to solve.</span></span>\n    </h1>''',
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Hero headline replacement count: {n}')

          # Hero description + micro line
          text, n = re.subn(
              r'''    <p class="thesis">.*?</p>\n    <p class="micro">.*?</p>''',
              '''    <p class="thesis">I build <span class="hl">digital products, SaaS concepts, business tools and custom websites.</span> Some are mine, some are for clients — all start with a real problem worth solving.</p>\n    <p class="micro">// products · SaaS · tools · custom web</p>''',
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Hero description replacement count: {n}')

          # About copy
          text, n = re.subn(
              r'''      <h2>Meet <span class="grad">Helal Safi\.</span></h2>\n(?:      <p>.*?</p>\n)+      <div class="sig">.*?</div>''',
              '''      <h2>Meet <span class="grad">Helal Safi.</span></h2>\n      <p>I'm a first-generation Lebanese-American based in <strong>Paris, Texas</strong>. My background is in customer-facing work and operations, so I tend to look at things from both the business and user side.</p>\n      <p><strong>Safi Solutions</strong> started with websites. It grew into the home for whatever I'm building — SaaS concepts, educational tools, business systems, and custom web work.</p>\n      <p>The common thread is simple: <strong>find a problem and make the solution easier to use.</strong></p>\n      <div class="sig">Find the friction.<br><span class="grad">Build the useful thing.</span></div>''',
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'About replacement count: {n}')

          # Contact intro
          text = text.replace(
              '<p>A website, software idea, internal tool, prototype, or something that\'s hard to categorize — tell me what you\'re trying to make, fix, or simplify.</p>',
              '<p>Website, software idea, internal tool, or something harder to label — tell me what you\'re trying to build.</p>',
              1,
          )

          # Keep animated phrases short enough to fit the hero.
          text, n = re.subn(
              r'''  const words=\[[^\]]+\];''',
              "  const words=['Built to be useful.','Made to solve.','Built differently.','Made to work.'];",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'Rotating words replacement count: {n}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Tighten Safi homepage copy"
          git push origin main
