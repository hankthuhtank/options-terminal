<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPT TERMINAL • GROK v2.1</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --bg:#050505;--bg2:#0b0b0b;--bg3:#111;--bg4:#161616;--bg5:#1c1c1c;
  --border:#1e1e1e;--border2:#272727;--border3:#333;
  --text:#d8d8d8;--text2:#aaa;--text3:#666;
  --g:#00ff6a;--g2:#00cc55;--g3:#00ff6a22;--g4:#00ff6a0d;
  --r:#ff2244;--r2:#cc1133;--r3:#ff224422;--r4:#ff22440d;
  --a:#ffcc00;--a2:#ffcc0022;
  --b:#0088ff;--b2:#0088ff22;
  --mono:'Space Mono',monospace;
  --sans:'DM Sans',sans-serif;
  --radius:4px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:13px}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border3);border-radius:2px}

body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);pointer-events:none;z-index:999}

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:42px;background:var(--bg);
  border-bottom:1px solid var(--border2);
  display:flex;align-items:center;
  padding:0 1rem;gap:0;
}
.brand{display:flex;align-items:center;gap:8px;margin-right:1.5rem;flex-shrink:0}
.brand-pulse{
  width:7px;height:7px;border-radius:50%;
  background:var(--g);
  box-shadow:0 0 10px var(--g),0 0 20px var(--g2);
  animation:pulse 2s ease-in-out infinite;
}
.brand-pulse.dead{background:var(--r);box-shadow:0 0 8px var(--r2);animation:none}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.brand-txt{font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--g)}
.brand-ver{font-size:8px;color:var(--text3);letter-spacing:.15em;align-self:flex-end;margin-bottom:2px}
.nav{display:flex;align-items:stretch;flex:1;height:100%}
.ntab{
  display:flex;align-items:center;padding:0 1rem;
  font-size:9px;font-weight:700;letter-spacing:.2em;
  color:var(--text3);cursor:pointer;border:none;background:none;
  border-bottom:2px solid transparent;transition:all .15s;
  font-family:var(--mono);white-space:nowrap;
}
.ntab:hover{color:var(--text2)}.ntab.on{color:var(--g);border-bottom-color:var(--g)}
.topbar-r{display:flex;align-items:center;gap:10px;margin-left:auto}
.ticker-ticker{
  display:flex;gap:12px;overflow:hidden;
  max-width:360px;align-items:center;
}
.tt-item{font-size:9px;letter-spacing:.08em;color:var(--text3);white-space:nowrap}
.tt-item .sym{color:var(--text2);margin-right:4px}
.tt-item .up{color:var(--g)}.tt-item .dn{color:var(--r)}
.tclock{font-size:10px;color:var(--text3);letter-spacing:.1em;min-width:70px;text-align:right}
.keybtn{
  font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.15em;padding:5px 12px;
  border:1px solid var(--g3);border-radius:var(--radius);
  background:var(--g4);color:var(--g);cursor:pointer;transition:all .12s;
}
.keybtn:hover{background:var(--g3)}

.shell{padding-top:42px;display:flex;min-height:100vh}
.sidebar{
  width:210px;flex-shrink:0;
  background:var(--bg2);border-right:1px solid var(--border);
  position:fixed;top:42px;left:0;bottom:0;
  display:flex;flex-direction:column;overflow-y:auto;z-index:40;
}
.main{margin-left:210px;flex:1;min-width:0}
.panel{display:none}.panel.on{display:block}

.sb-sec{
  font-size:8px;font-weight:700;letter-spacing:.25em;
  color:var(--text3);padding:.85rem .85rem .35rem;text-transform:uppercase;
}
.sb-div{height:1px;background:var(--border);margin:.4rem 0}
.wl-add{display:flex;gap:5px;padding:.5rem .7rem}
.wl-inp{
  flex:1;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius);color:var(--text);
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  padding:5px 7px;outline:none;text-transform:uppercase;
  transition:border-color .12s;
}
.wl-inp::placeholder{text-transform:none;font-size:9px;color:var(--text3)}
.wl-inp:focus{border-color:var(--g2)}
.wl-addbtn{
  background:var(--g3);border:1px solid var(--g2);
  border-radius:var(--radius);color:var(--g);
  font-size:14px;font-weight:700;padding:3px 9px;
  cursor:pointer;transition:opacity .1s;font-family:var(--mono);
}
.wl-addbtn:hover{opacity:.75}
.wl-list{padding:0 0 .5rem}
.wl-row{
  display:flex;align-items:center;padding:5px .85rem;
  cursor:pointer;border-left:2px solid transparent;
  transition:all .1s;gap:6px;
}
.wl-row:hover{background:var(--bg3);border-left-color:var(--border3)}
.wl-row.hot{border-left-color:var(--g);background:var(--g4)}
.wl-sym{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text);flex:1}
.wl-chg{font-size:10px;font-weight:700}
.wl-chg.u{color:var(--g)}.wl-chg.d{color:var(--r)}
.wl-rm{
  background:none;border:none;color:var(--border3);
  font-size:13px;cursor:pointer;padding:0 2px;
  opacity:0;transition:all .1s;font-family:var(--mono);
}
.wl-row:hover .wl-rm{opacity:1}.wl-rm:hover{color:var(--r)}
.wl-empty{padding:.75rem .85rem;font-size:10px;color:var(--text3);font-family:var(--sans);line-height:1.6}

.apanel{padding:1.25rem;max-width:960px}
.no-key{
  display:none;margin-bottom:1rem;
  background:var(--r4);border:1px solid var(--r3);
  border-radius:var(--radius);padding:.6rem .9rem;
  font-size:10px;color:var(--r);font-family:var(--sans);
}
.no-key.on{display:block}.no-key a{color:var(--r);cursor:pointer;text-decoration:underline}
.sbar{display:flex;gap:7px;margin-bottom:.85rem}
.t-inp{
  flex:1;background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--radius);color:var(--g);
  font-family:var(--mono);font-size:22px;font-weight:700;
  letter-spacing:.18em;padding:11px 16px;outline:none;
  text-transform:uppercase;transition:border-color .12s;
  text-shadow:0 0 20px var(--g2);
}
.t-inp::placeholder{font-size:13px;color:var(--text3);letter-spacing:.04em;text-transform:none;font-weight:400;text-shadow:none}
.t-inp:focus{border-color:var(--g2);box-shadow:0 0 0 1px var(--g3)}
.abtn{
  background:var(--g);border:none;border-radius:var(--radius);
  color:#000;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.2em;padding:11px 22px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
  box-shadow:0 0 20px var(--g3);
}
.abtn:hover{box-shadow:0 0 30px var(--g2);opacity:.9}
.abtn:disabled{opacity:.2;cursor:not-allowed;box-shadow:none}

.model-bar {
  display:flex; gap:12px; align-items:center; margin-bottom:1rem; flex-wrap:wrap;
}
.model-select {
  background:var(--bg3); color:var(--g); border:1px solid var(--border2);
  padding:8px 12px; border-radius:var(--radius); font-family:var(--mono); font-size:11px;
}
.cost-est { font-size:9px; color:var(--text3); letter-spacing:.15em; }

.ld-wrap{display:none;text-align:center;padding:4rem 0}.ld-wrap.on{display:block}
.ld-sym{
  font-size:48px;font-weight:700;letter-spacing:.4em;
  color:var(--g);text-shadow:0 0 40px var(--g),0 0 80px var(--g2);
  margin-bottom:.4rem;animation:glitch 4s infinite;
}
@keyframes glitch{
  0%,94%,100%{text-shadow:0 0 40px var(--g),0 0 80px var(--g2)}
  95%{text-shadow:3px 0 var(--r),-3px 0 var(--b),0 0 40px var(--g)}
  96%{text-shadow:-3px 0 var(--r),3px 0 var(--b),0 0 40px var(--g)}
  97%{text-shadow:3px 0 var(--r),-3px 0 var(--b),0 0 40px var(--g)}
}
.ld-bar-bg{width:200px;height:1px;background:var(--border2);margin:.9rem auto;overflow:hidden}
.ld-bar{height:100%;background:var(--g);animation:sweep 1.5s ease-in-out infinite}
@keyframes sweep{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
.ld-msg{font-size:9px;letter-spacing:.2em;color:var(--text3)}

.out-wrap{display:none}.out-wrap.on{display:block}
.out-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:.85rem;flex-wrap:wrap;gap:8px;
}
.out-meta{font-size:8px;letter-spacing:.18em;color:var(--text3)}
.out-badge{
  font-size:12px;font-weight:700;letter-spacing:.18em;
  color:var(--g);background:var(--g4);
  border:1px solid var(--g3);padding:3px 12px;border-radius:var(--radius);
  text-shadow:0 0 12px var(--g2);
}
.out-body{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:6px;padding:1.75rem 2rem;
  font-family:var(--sans);font-size:13.5px;line-height:1.85;color:#c0c0c0;
}
.out-body h2{
  font-family:var(--mono);font-size:9px;letter-spacing:.28em;font-weight:700;
  color:var(--g);margin:1.6rem 0 .6rem;
  padding-bottom:.4rem;border-bottom:1px solid var(--border2);text-transform:uppercase;
}
.out-body h3{font-family:var(--mono);font-size:10px;color:var(--a);margin:1.2rem 0 .4rem}
.err-wrap{
  display:none;background:var(--r4);border:1px solid var(--r3);
  border-radius:var(--radius);padding:1rem 1.25rem;
  font-size:11px;color:var(--r);font-family:var(--mono);
  letter-spacing:.04em;white-space:pre-line;
}
.err-wrap.on{display:block}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="brand-pulse" id="bpulse"></span>
    <span class="brand-txt">OPT</span>
    <span class="brand-ver">TERMINAL v2.1 • GROK</span>
  </div>
  <nav class="nav">
    <button class="ntab on" onclick="sw('analyze',this)">ANALYZE</button>
    <button class="ntab" onclick="sw('chart',this)">CHART</button>
    <button class="ntab" onclick="sw('watchlist',this)">WATCHLIST</button>
    <button class="ntab" onclick="sw('sector',this)">SECTOR</button>
    <button class="ntab" onclick="sw('scanner',this)">SCANNER</button>
  </nav>
  <div class="topbar-r">
    <div class="ticker-ticker" id="topTicker"></div>
    <span class="tclock" id="clk"></span>
    <button class="keybtn" onclick="openKey()">? KEY</button>
  </div>
</div>

<div class="shell">
  <aside class="sidebar">
    <div class="sb-sec">WATCHLIST</div>
    <div class="wl-add">
      <input class="wl-inp" id="wlInp" placeholder="add ticker..." maxlength="8"/>
      <button class="wl-addbtn" onclick="addWatch()">+</button>
    </div>
    <div class="wl-list" id="sbWl"></div>
  </aside>

  <div class="main">
    <div class="panel on" id="panel-analyze">
      <div class="apanel">
        <div class="no-key" id="nkBanner">
          No API key set. <a onclick="openKey()">Configure API keys</a>
        </div>

        <div class="model-bar">
          <select id="modelSelect" class="model-select">
            <option value="grok">?? GROK (Recommended - Cheapest)</option>
            <option value="claude">?? CLAUDE SONNET</option>
            <option value="gemini">? GEMINI FLASH</option>
          </select>
          <span id="costEst" class="cost-est"></span>
        </div>

        <div class="sbar">
          <input class="t-inp" id="tInp" placeholder="ticker symbol..." maxlength="8" autocomplete="off"/>
          <button class="abtn" id="aBtn" onclick="runAna()">ANALYZE ?</button>
        </div>

        <div class="ld-wrap" id="ldWrap">
          <div class="ld-sym" id="ldSym"></div>
          <div class="ld-bar-bg"><div class="ld-bar"></div></div>
          <div class="ld-msg" id="ldMsg">analyzing markets...</div>
        </div>

        <div class="out-wrap" id="outWrap">
          <div class="out-header">
            <span class="out-meta" id="outMeta"></span>
            <span class="out-badge" id="outBadge"></span>
          </div>
          <div class="out-body" id="outBody"></div>
        </div>

        <div class="err-wrap" id="errWrap"></div>
      </div>
    </div>

    <div class="panel" id="panel-chart">CHART PANEL COMING SOON</div>
    <div class="panel" id="panel-watchlist">WATCHLIST PANEL COMING SOON</div>
    <div class="panel" id="panel-sector">SECTOR PANEL COMING SOON</div>
    <div class="panel" id="panel-scanner">SCANNER PANEL COMING SOON</div>
  </div>
</div>

<div id="keyModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;align-items:center;justify-content:center">
  <div style="background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:2rem;width:100%;max-width:460px">
    <h2 style="font-size:11px;letter-spacing:.25em;color:var(--g);margin-bottom:1rem">API KEYS</h2>
    
    <div style="margin-bottom:1rem">
      <div style="font-size:9px;color:var(--text3);margin-bottom:4px">GROK (xAI)</div>
      <input id="grokKey" type="password" placeholder="grok api key" style="width:100%;background:var(--bg3);border:1px solid var(--border);padding:9px;border-radius:4px;color:var(--text);font-family:var(--mono)">
    </div>
    <div style="margin-bottom:1rem">
      <div style="font-size:9px;color:var(--text3);margin-bottom:4px">ANTHROPIC (Claude)</div>
      <input id="claudeKey" type="password" placeholder="sk-ant-..." style="width:100%;background:var(--bg3);border:1px solid var(--border);padding:9px;border-radius:4px;color:var(--text);font-family:var(--mono)">
    </div>
    <div style="text-align:right">
      <button onclick="closeKey()" style="background:none;border:1px solid var(--border);color:var(--text3);padding:8px 16px;margin-right:8px;border-radius:4px;cursor:pointer">CANCEL</button>
      <button onclick="saveKeys()" style="background:var(--g);color:#000;padding:8px 20px;border:none;border-radius:4px;cursor:pointer;font-weight:700">SAVE KEYS</button>
    </div>
  </div>
</div>

<script>
// STATE
let currentModel = localStorage.getItem('opt_model') || 'grok';

const MODELS = {
  grok: { name: "grok-beta", estCost: "0.06-0.12" },
  claude: { name: "claude-3-5-sonnet-20241022", estCost: "0.60-0.80" },
  gemini: { name: "gemini-2.0-flash-exp", estCost: "0.03-0.05" }
};

const SYS = `You are a elite tier-1 options trading analyst. Deliver precise, data-driven, actionable analysis.

Use these exact markdown headers:

## MARKET SNAPSHOT
## TECHNICAL ANALYSIS
## OPTIONS INTELLIGENCE
## TRADE RECOMMENDATIONS
## RISK MATRIX
## FINAL SUMMARY

Be concise, use real numbers, specific strikes/levels.`;

function saveKeys() {
  localStorage.setItem('grok_key', document.getElementById('grokKey').value.trim());
  localStorage.setItem('claude_key', document.getElementById('claudeKey').value.trim());
  closeKey();
  chkKey();
}

function openKey() {
  document.getElementById('grokKey').value = localStorage.getItem('grok_key') || '';
  document.getElementById('claudeKey').value = localStorage.getItem('claude_key') || '';
  document.getElementById('keyModal').style.display = 'flex';
}

function closeKey() {
  document.getElementById('keyModal').style.display = 'none';
}

function getKey(model) {
  if (model === 'grok') return localStorage.getItem('grok_key') || '';
  if (model === 'claude') return localStorage.getItem('claude_key') || '';
  return '';
}

function chkKey() {
  const hasGrok = !!getKey('grok');
  document.getElementById('bpulse').className = 'brand-pulse' + (hasGrok ? '' : ' dead');
}

function sw(id, tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.ntab').forEach(t => t.classList.remove('on'));
  document.getElementById('panel-' + id).classList.add('on');
  tab.classList.add('on');
}

async function runAna() {
  const ticker = document.getElementById('tInp').value.trim().toUpperCase();
  if (!ticker) return;

  const modelType = document.getElementById('modelSelect').value;
  const key = getKey(modelType);

  if (!key) {
    alert(`Please set your ${modelType.toUpperCase()} API key first.`);
    openKey();
    return;
  }

  document.getElementById('costEst').textContent = `Est. cost: ~$${MODELS[modelType].estCost}`;

  document.getElementById('ldWrap').classList.add('on');
  document.getElementById('outWrap').classList.remove('on');
  document.getElementById('errWrap').classList.remove('on');
  document.getElementById('ldSym').textContent = ticker;

  try {
    const userMsg = `Perform a complete professional options trading analysis on ${ticker}. Use current market data.`;

    let response;
    if (modelType === 'grok') {
      response = await fetch('https://api.x.ai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${key}`
        },
        body: JSON.stringify({
          model: "grok-beta",
          messages: [
            { role: "system", content: SYS },
            { role: "user", content: userMsg }
          ],
          temperature: 0.7,
          max_tokens: 1600
        })
      });
    } else if (modelType === 'claude') {
      response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01'
        },
        body: JSON.stringify({
          model: MODELS.claude.name,
          max_tokens: 1600,
          system: SYS,
          messages: [{ role: "user", content: userMsg }]
        })
      });
    }

    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    let text = modelType === 'grok' ? data.choices[0].message.content : data.content[0].text;

    document.getElementById('ldWrap').classList.remove('on');
    document.getElementById('outWrap').classList.add('on');
    document.getElementById('outMeta').textContent = `ANALYSIS • ${new Date().toLocaleString()}`;
    document.getElementById('outBadge').textContent = ticker;
    document.getElementById('outBody').innerHTML = text
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  } catch (err) {
    document.getElementById('ldWrap').classList.remove('on');
    document.getElementById('errWrap').classList.add('on');
    document.getElementById('errWrap').innerHTML = `Error: ${err.message}<br><br>Check your API key.`;
  }
}

// Clock
function tick() {
  const n = new Date();
  document.getElementById('clk').textContent = n.toLocaleString([], {dateStyle:'short', timeStyle:'short'});
}
setInterval(tick, 1000); tick();

// Init
document.getElementById('modelSelect').value = currentModel;
document.getElementById('modelSelect').onchange = (e) => {
  currentModel = e.target.value;
  localStorage.setItem('opt_model', currentModel);
};

chkKey();
document.getElementById('tInp').addEventListener('keydown', e => { if (e.key === 'Enter') runAna(); });
</script>
</body>
</html>
