<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">CarDesk</title>
  <desc id="desc">CarDesk vehicle intelligence logo</desc>
  <defs>
    <linearGradient id="mark" x1="18" y1="22" x2="146" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ED8FF"/>
      <stop offset="0.48" stop-color="#5B9BD5"/>
      <stop offset="1" stop-color="#2F65A4"/>
    </linearGradient>
    <linearGradient id="word" x1="374" y1="0" x2="610" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FC3F2"/>
      <stop offset="1" stop-color="#4B84C4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(18 14)">
    <rect x="4" y="4" width="146" height="146" rx="38" fill="#0D1B2E" stroke="#213B5B" stroke-width="3"/>
    <path d="M119 51c-10-13-25-21-42-21-30 0-54 24-54 54s24 54 54 54c17 0 32-8 42-21" fill="none" stroke="url(#mark)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M71 59h42" stroke="#DDEEFF" stroke-width="7" stroke-linecap="round"/>
    <path d="M71 84h57" stroke="#DDEEFF" stroke-width="7" stroke-linecap="round"/>
    <path d="M71 109h42" stroke="#DDEEFF" stroke-width="7" stroke-linecap="round"/>
    <circle cx="123" cy="59" r="5" fill="#7FC3F2"/>
    <circle cx="136" cy="84" r="5" fill="#5B9BD5"/>
    <circle cx="123" cy="109" r="5" fill="#3E7CB8"/>
  </g>

  <text x="198" y="104" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="800" letter-spacing="-4.2" fill="#EDF1F8">Car<tspan fill="url(#word)">Desk</tspan></text>
  <text x="202" y="136" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="5.4" fill="#7F96B6">VEHICLE INTELLIGENCE</text>
