<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="Where building water comes in">
<rect width="1000" height="520" fill="#12151A"/>
<rect x="0" y="0" width="1000" height="4" fill="#2FA36B"/>
<text x="36" y="52" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="26" font-weight="700" letter-spacing="-0.01em">Where building water comes in</text>
<text x="36" y="78" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="14">Every device on the service line answers a different question: how much, how fast, and which way.</text>
<line x1="36" y1="96" x2="964" y2="96" stroke="#2E3540"/>
<path d="M70 262 L940 262" stroke="#2FA36B" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
<rect x="120" y="236" width="60" height="52" rx="8" fill="#1A1F26" stroke="#2FA36B" stroke-width="2"/>
<path d="M150 236 L150 200" stroke="#455060" stroke-width="1" stroke-dasharray="3 3"/>
<text x="150" y="174" fill="#E9E5DC" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.06em">CURB STOP</text>
<text x="150" y="192" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="9" font-weight="500" text-anchor="middle" letter-spacing="0.06em">utility side shutoff</text>
<rect x="300" y="236" width="60" height="52" rx="8" fill="#1A1F26" stroke="#2FA36B" stroke-width="2"/>
<path d="M330 288 L330 324" stroke="#455060" stroke-width="1" stroke-dasharray="3 3"/>
<text x="330" y="344" fill="#E9E5DC" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.06em">METER</text>
<text x="330" y="362" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="9" font-weight="500" text-anchor="middle" letter-spacing="0.06em">measures volume used</text>
<rect x="480" y="236" width="60" height="52" rx="8" fill="#1A1F26" stroke="#2FA36B" stroke-width="2"/>
<path d="M510 236 L510 200" stroke="#455060" stroke-width="1" stroke-dasharray="3 3"/>
<text x="510" y="174" fill="#E9E5DC" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.06em">BACKFLOW DEVICE</text>
<text x="510" y="192" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="9" font-weight="500" text-anchor="middle" letter-spacing="0.06em">protects the main</text>
<rect x="660" y="236" width="60" height="52" rx="8" fill="#1A1F26" stroke="#2FA36B" stroke-width="2"/>
<path d="M690 288 L690 324" stroke="#455060" stroke-width="1" stroke-dasharray="3 3"/>
<text x="690" y="344" fill="#E9E5DC" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.06em">PRESSURE-REDUCING</text>
<text x="690" y="362" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="9" font-weight="500" text-anchor="middle" letter-spacing="0.06em">street pressure to building</text>
<rect x="840" y="236" width="60" height="52" rx="8" fill="#1A1F26" stroke="#2FA36B" stroke-width="2"/>
<path d="M870 236 L870 200" stroke="#455060" stroke-width="1" stroke-dasharray="3 3"/>
<text x="870" y="174" fill="#E9E5DC" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.06em">MAIN SHUTOFF</text>
<text x="870" y="192" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="9" font-weight="500" text-anchor="middle" letter-spacing="0.06em">first valve in an emergency</text>
<path d="M70 262 L70 192" stroke="#2FA36B" stroke-width="10" opacity="0.45" stroke-linecap="round"/>
<text x="70" y="174" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="9" font-weight="500" text-anchor="middle" letter-spacing="0.06em">FROM MAIN</text>
<text x="940" y="240" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="9" font-weight="500" text-anchor="middle" letter-spacing="0.06em">TO BUILDING</text>
<line x1="36" y1="410" x2="964" y2="410" stroke="#2E3540"/>
<text x="36" y="440" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="14" text-anchor="start">Order varies by jurisdiction and hazard level. Read the actual installation before assuming.</text>
<text x="36" y="464" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Potable lines downstream must be lead-free: 0.25% weighted average across wetted surfaces,</text>
<text x="36" y="484" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">0.2% for solder and flux, per NSF/ANSI/CAN 372.</text>
</svg>
