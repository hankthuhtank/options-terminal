<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect width="1000" height="560" fill="#06110d"/>
  <text x="40" y="48" fill="#e8eee9" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Shaft alignment</text>
  <text x="40" y="80" fill="#9fb0a7" font-family="system-ui,sans-serif" font-size="15">Centerlines of coupled machines should meet. Offset and angular error load bearings, seals, and the coupling.</text>

  <!-- BAD: offset -->
  <rect x="40" y="120" width="440" height="190" rx="16" fill="#0a1511" stroke="#24362c"/>
  <text x="60" y="155" fill="#f0a0a0" font-family="system-ui,sans-serif" font-size="16" font-weight="700">OFFSET (parallel misalignment)</text>
  <line x1="80" y1="210" x2="240" y2="210" stroke="#7ce3a0" stroke-width="10" stroke-linecap="round"/>
  <line x1="280" y1="250" x2="440" y2="250" stroke="#f0c45c" stroke-width="10" stroke-linecap="round"/>
  <circle cx="260" cy="230" r="18" fill="none" stroke="#d7ff64" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="60" y="290" fill="#b8c5bd" font-family="system-ui,sans-serif" font-size="14">Centerlines are parallel but not on the same line.</text>

  <!-- BAD: angular -->
  <rect x="520" y="120" width="440" height="190" rx="16" fill="#0a1511" stroke="#24362c"/>
  <text x="540" y="155" fill="#f0a0a0" font-family="system-ui,sans-serif" font-size="16" font-weight="700">ANGULAR misalignment</text>
  <line x1="560" y1="230" x2="720" y2="210" stroke="#7ce3a0" stroke-width="10" stroke-linecap="round"/>
  <line x1="760" y1="220" x2="920" y2="260" stroke="#f0c45c" stroke-width="10" stroke-linecap="round"/>
  <text x="540" y="290" fill="#b8c5bd" font-family="system-ui,sans-serif" font-size="14">Centerlines meet at an angle instead of running true.</text>

  <!-- GOOD -->
  <rect x="40" y="340" width="920" height="180" rx="16" fill="#0a1511" stroke="#2a4034"/>
  <text x="60" y="380" fill="#d7ff64" font-family="system-ui,sans-serif" font-size="16" font-weight="700">ALIGNED</text>
  <line x1="120" y1="440" x2="420" y2="440" stroke="#7ce3a0" stroke-width="12" stroke-linecap="round"/>
  <line x1="480" y1="440" x2="780" y2="440" stroke="#7ce3a0" stroke-width="12" stroke-linecap="round"/>
  <circle cx="450" cy="440" r="22" fill="none" stroke="#d7ff64" stroke-width="2"/>
  <text x="60" y="490" fill="#b8c5bd" font-family="system-ui,sans-serif" font-size="14">Both centerlines share one continuous axis through the coupling.</text>
</svg>
