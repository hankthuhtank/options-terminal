<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="#06110d"/>
<rect x="50" y="50" width="1100" height="700" rx="28" fill="#081711" stroke="#23372d"/>
<text x="90" y="110" fill="#d9e2dd" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Hydraulic pressure in a real circuit</text>
<text x="90" y="150" fill="#9fb0a7" font-family="Arial, Helvetica, sans-serif" font-size="24">The pump creates flow. Pressure only rises when the load resists motion.</text>
<rect x="110" y="290" width="190" height="130" rx="16" fill="#103126" stroke="#79e1c0" stroke-width="3"/>
<circle cx="205" cy="355" r="44" fill="#0a1914" stroke="#79e1c0" stroke-width="4"/>
<path d="M205 355 L234 329" stroke="#f4c96b" stroke-width="6" stroke-linecap="round"/>
<circle cx="205" cy="355" r="6" fill="#f4c96b"/>
<text x="140" y="455" fill="#d9e2dd" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Pressure gauge</text>
<text x="110" y="490" fill="#9fb0a7" font-family="Arial, Helvetica, sans-serif" font-size="20">What you read when the circuit meets resistance.</text>
<rect x="450" y="265" width="220" height="180" rx="26" fill="#0c231b" stroke="#79e1c0" stroke-width="3"/>
<circle cx="560" cy="355" r="62" fill="#0a1914" stroke="#79e1c0" stroke-width="5"/>
<path d="M523 355 L597 318 L597 392 Z" fill="#d9e2dd"/>
<text x="487" y="480" fill="#d9e2dd" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Pump</text>
<text x="450" y="515" fill="#9fb0a7" font-family="Arial, Helvetica, sans-serif" font-size="20">Adds flow to the circuit.</text>
<rect x="810" y="250" width="250" height="90" rx="20" fill="#0c231b" stroke="#79e1c0" stroke-width="3"/>
<rect x="840" y="270" width="48" height="50" rx="8" fill="#d9e2dd"/>
<path d="M888 295 H1060" stroke="#d9e2dd" stroke-width="12" stroke-linecap="round"/>
<text x="840" y="380" fill="#d9e2dd" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Cylinder + load</text>
<text x="810" y="415" fill="#9fb0a7" font-family="Arial, Helvetica, sans-serif" font-size="20">When the load resists, the gauge shows pressure.</text>
<path d="M300 355 H450" stroke="#79e1c0" stroke-width="10" stroke-linecap="round"/>
<path d="M670 355 H810" stroke="#79e1c0" stroke-width="10" stroke-linecap="round"/>
<path d="M935 340 V560 H205 V420" stroke="#406f5f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="345" cy="355" r="8" fill="#f4c96b"/><circle cx="390" cy="355" r="8" fill="#f4c96b"/><circle cx="715" cy="355" r="8" fill="#f4c96b"/><circle cx="760" cy="355" r="8" fill="#f4c96b"/>
<text x="90" y="620" fill="#cbe6db" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">How to read it</text>
<text x="90" y="665" fill="#a7b7af" font-family="Arial, Helvetica, sans-serif" font-size="22">1. Start the pump.</text>
<text x="90" y="698" fill="#a7b7af" font-family="Arial, Helvetica, sans-serif" font-size="22">2. If the actuator moves freely, pressure stays low.</text>
<text x="460" y="665" fill="#a7b7af" font-family="Arial, Helvetica, sans-serif" font-size="22">3. As the load rises, the gauge reading rises.</text>
<text x="460" y="698" fill="#a7b7af" font-family="Arial, Helvetica, sans-serif" font-size="22">4. Pressure is not the same thing as flow.</text>
</svg>