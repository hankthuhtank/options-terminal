<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="Belt drive: speed traded for torque">
<rect width="1000" height="520" fill="#12151A"/>
<rect x="0" y="0" width="1000" height="4" fill="#E4712F"/>
<text x="36" y="52" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="26" font-weight="700" letter-spacing="-0.01em">Belt drive: speed traded for torque</text>
<text x="36" y="78" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="14">Sheave diameters set the ratio. Tension sets whether the belt transmits it or polishes itself away.</text>
<line x1="36" y1="96" x2="964" y2="96" stroke="#2E3540"/>
<circle cx="250" cy="250" r="72" fill="none" stroke="#455060" stroke-width="4"/>
<circle cx="250" cy="250" r="10" fill="#455060"/>
<circle cx="620" cy="250" r="128" fill="none" stroke="#455060" stroke-width="4"/>
<circle cx="620" cy="250" r="14" fill="#455060"/>
<path d="M250 178 L620 122" stroke="#E4712F" stroke-width="6" stroke-linecap="round"/>
<path d="M250 322 L620 378" stroke="#E4712F" stroke-width="6" stroke-linecap="round"/>
<text x="250" y="350" fill="#E9E5DC" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0.06em">DRIVER</text>
<text x="250" y="366" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10" font-weight="500" text-anchor="middle" letter-spacing="0.06em">motor sheave  Ø 4″</text>
<text x="620" y="406" fill="#E9E5DC" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0.06em">DRIVEN</text>
<text x="620" y="422" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10" font-weight="500" text-anchor="middle" letter-spacing="0.06em">load sheave  Ø 8″</text>
<rect x="790" y="150" width="172" height="200" rx="12" fill="#1A1F26" stroke="#2E3540"/>
<text x="812" y="178" fill="#E4712F" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="12" font-weight="600" text-anchor="start" letter-spacing="0.06em">RATIO 2:1</text>
<text x="812" y="206" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Speed halves</text>
<text x="812" y="228" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Torque roughly doubles</text>
<text x="812" y="258" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Power stays the same</text>
<text x="812" y="280" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="12" text-anchor="start">minus belt losses</text>
<text x="812" y="314" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="9" font-weight="500" text-anchor="start" letter-spacing="0.06em">SLIP SHOWS AS</text>
<text x="812" y="334" fill="#E4712F" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="12" text-anchor="start">heat, dust, squeal</text>
<line x1="36" y1="440" x2="964" y2="440" stroke="#2E3540"/>
<text x="36" y="470" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="14" text-anchor="start">Check alignment before tension. A misaligned drive wears the belt edge no matter how tight you set it.</text>
</svg>
