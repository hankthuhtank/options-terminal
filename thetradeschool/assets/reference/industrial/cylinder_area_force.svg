<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="#06110d"/>
<rect x="40" y="40" width="1120" height="720" rx="28" fill="#081711" stroke="#23372d"/>
<text x="90" y="112" fill="#d9e2dd" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Cylinder area turns pressure into force</text>
<text x="90" y="150" fill="#9fb0a7" font-family="Arial, Helvetica, sans-serif" font-size="24">Same pressure, different piston area = different pushing force.</text>
<g>
<rect x="110" y="260" width="360" height="120" rx="24" fill="#0c231b" stroke="#79e1c0" stroke-width="4"/>
<circle cx="190" cy="320" r="40" fill="#d9e2dd" opacity="0.95"/>
<path d="M230 320 H430" stroke="#d9e2dd" stroke-width="18" stroke-linecap="round"/>
<text x="110" y="225" fill="#cbe6db" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Smaller piston area</text>
<text x="110" y="430" fill="#f4c96b" font-family="Arial, Helvetica, sans-serif" font-size="26">Example: 500 psi × 4 in² = 2,000 lb theoretical force</text>
</g>
<g>
<rect x="650" y="235" width="410" height="170" rx="30" fill="#0c231b" stroke="#79e1c0" stroke-width="4"/>
<circle cx="770" cy="320" r="70" fill="#d9e2dd" opacity="0.95"/>
<path d="M840 320 H1020" stroke="#d9e2dd" stroke-width="24" stroke-linecap="round"/>
<text x="650" y="200" fill="#cbe6db" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Larger piston area</text>
<text x="650" y="455" fill="#f4c96b" font-family="Arial, Helvetica, sans-serif" font-size="26">Example: 500 psi × 10 in² = 5,000 lb theoretical force</text>
</g>
<path d="M110 520 H1060" stroke="#23372d" stroke-width="2"/>
<text x="90" y="582" fill="#d9e2dd" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Retraction side note</text>
<text x="90" y="622" fill="#a7b7af" font-family="Arial, Helvetica, sans-serif" font-size="22">On the rod side, some piston area is occupied by the rod, so the effective area is smaller.</text>
<text x="90" y="655" fill="#a7b7af" font-family="Arial, Helvetica, sans-serif" font-size="22">That is why retraction force is usually lower than extension force at the same pressure.</text>
<rect x="760" y="560" width="280" height="120" rx="20" fill="#0c231b" stroke="#79e1c0" stroke-width="3"/>
<rect x="785" y="590" width="38" height="60" rx="6" fill="#d9e2dd"/>
<path d="M823 620 H980" stroke="#d9e2dd" stroke-width="18" stroke-linecap="round"/>
<rect x="823" y="590" width="18" height="60" fill="#081711"/>
<text x="910" y="610" fill="#cbe6db" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle">Rod reduces area</text>
</svg>