<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Four arc processes, four things feeding the puddle">
<rect width="1000" height="620" fill="#12151A"/>
<rect x="0" y="0" width="1000" height="4" fill="#C4472F"/>
<text x="36" y="52" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="26" font-weight="700" letter-spacing="-0.01em">Four arc processes, four things feeding the puddle</text>
<text x="36" y="78" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="14">What shields the arc and what adds the filler is the difference that matters at the joint.</text>
<line x1="36" y1="96" x2="964" y2="96" stroke="#2E3540"/>
<text x="64" y="122" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10" font-weight="500" text-anchor="start" letter-spacing="0.06em">PROCESS</text>
<text x="250" y="122" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10" font-weight="500" text-anchor="start" letter-spacing="0.06em">SHIELDING</text>
<text x="530" y="122" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10" font-weight="500" text-anchor="start" letter-spacing="0.06em">FILLER</text>
<text x="760" y="122" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10" font-weight="500" text-anchor="start" letter-spacing="0.06em">FIELD TRADE-OFF</text>
<line x1="40" y1="136" x2="960" y2="136" stroke="#2E3540"/>
<rect x="40" y="152" width="920" height="72" rx="10" fill="#1A1F26" stroke="#2E3540"/>
<text x="64" y="184" fill="#C4472F" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0.06em">SMAW</text>
<text x="64" y="204" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0.06em">Stick</text>
<text x="250" y="190" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Flux coating on the electrode</text>
<text x="530" y="190" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Consumable stick electrode</text>
<text x="760" y="190" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="12" text-anchor="start">Slag to chip. Works in wind.</text>
<rect x="40" y="240" width="920" height="72" rx="10" fill="#1A1F26" stroke="#2E3540"/>
<text x="64" y="272" fill="#C4472F" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0.06em">GMAW</text>
<text x="64" y="292" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0.06em">MIG</text>
<text x="250" y="278" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Shielding gas from a bottle</text>
<text x="530" y="278" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Continuous solid wire</text>
<text x="760" y="278" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="12" text-anchor="start">Fast and clean. Drafts kill the shield.</text>
<rect x="40" y="328" width="920" height="72" rx="10" fill="#1A1F26" stroke="#2E3540"/>
<text x="64" y="360" fill="#C4472F" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0.06em">FCAW</text>
<text x="64" y="380" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0.06em">Flux core</text>
<text x="250" y="366" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Flux inside the wire, gas optional</text>
<text x="530" y="366" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Continuous tubular wire</text>
<text x="760" y="366" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="12" text-anchor="start">Outdoor capable. Produces slag.</text>
<rect x="40" y="416" width="920" height="72" rx="10" fill="#1A1F26" stroke="#2E3540"/>
<text x="64" y="448" fill="#C4472F" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0.06em">GTAW</text>
<text x="64" y="468" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0.06em">TIG</text>
<text x="250" y="454" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Shielding gas from a bottle</text>
<text x="530" y="454" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Separate filler rod, if any</text>
<text x="760" y="454" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="12" text-anchor="start">Most control. Slowest. Cleanest.</text>
<line x1="36" y1="510" x2="964" y2="510" stroke="#2E3540"/>
<text x="36" y="540" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="14" text-anchor="start">Heat input = (volts × amps × 60) ÷ (travel speed in in/min), reported in kJ/in.</text>
<text x="36" y="564" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">The welding procedure specification sets the window. Fume control is chosen from the base metal and any coating on it, not the process alone.</text>
</svg>
